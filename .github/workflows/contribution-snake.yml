name: Update profile visuals

"on":
  schedule:
    - cron: "17 0,12 * * *" # 08:17 and 20:17 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml
      - scripts/**

permissions:
  contents: write

concurrency:
  group: profile-snake-v3
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          path: source
          persist-credentials: false

      - name: Check out pinned snake renderer
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: Platane/snk
          ref: d8f6715049803e982ee5ff501b6b9b7d5deeb09b
          path: source/.snake-engine
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Build contribution renderer
        working-directory: source
        run: |
          npm ci --prefix scripts
          npm run build --prefix scripts

      - name: Generate the latest 90 days
        working-directory: source
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node dist/generate-snake.mjs

      - name: Add dark card background
        working-directory: source
        run: >-
          python3 scripts/style-snake.py
          dist/github-contribution-grid-snake-dark.svg
          dist/github-contribution-snake.json
          dist/github-contribution-grid-snake.svg

      - name: Generate project cards with current stars
        working-directory: source
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate-project-cards.py

      - name: Check out generated images
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: snake
          path: snake-output

      - name: Publish updated images
        shell: bash
        run: |
          cp source/dist/github-contribution-grid-snake.svg source/dist/github-contribution-grid-snake-dark.svg source/dist/github-contribution-snake.json snake-output/
          mkdir -p snake-output/project-cards
          rsync -a --delete source/dist/project-cards/ snake-output/project-cards/
          cd snake-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg github-contribution-snake.json project-cards/
          if git diff --cached --quiet; then
            echo "Profile visuals are already up to date."
            exit 0
          fi
          git commit -m "chore: update profile visuals and project stars"
          git push origin HEAD:snake

  writing:
    name: Sync latest Juejin writing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current profile
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main

      - name: Verify Writing updater
        run: python3 -m unittest discover -s scripts -p 'test_update_writing.py'

      - name: Fetch public articles, columns, and writing statistics
        run: python3 scripts/update-writing.py

      - name: Publish updated Writing section
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Writing is already up to date."
            exit 0
          fi
          git commit -m "chore: sync latest Juejin writing"
          git pull --rebase origin main
          git push origin HEAD:main
